name: Validate Agents

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/validate-agents.sh'
      - 'git-workflows/**'
      - '.github/workflows/validate-agents.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/validate-agents.sh'
      - 'git-workflows/**'
      - '.github/workflows/validate-agents.yml'

jobs:
  validate:
    name: Validate Agent Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x scripts/validate-agents.sh

      - name: Run agent validation
        run: ./scripts/validate-agents.sh

      - name: Upload validation results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            plugins/
            scripts/validate-agents.sh
          retention-days: 5

  lint-markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint agent markdown files
        run: |
          markdownlint 'plugins/**/agents/*.md' 'plugins/**/skills/*/SKILL.md' --config .markdownlint.json || true
        continue-on-error: true

  check-yaml:
    name: Check YAML Frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML frontmatter
        run: |
          python3 << 'EOF'
          import glob
          import os
          import sys

          import yaml

          plugins_dir = 'plugins'
          failed = False

          # Agents are agents/<name>.md; skills are skills/<name>/SKILL.md.
          # Anything else under a skill directory is a support file (templates,
          # examples) and carries no frontmatter.
          targets = [(p, 'agent') for p in glob.glob(f'{plugins_dir}/*/agents/*.md')]
          targets += [(p, 'skill') for p in glob.glob(f'{plugins_dir}/*/skills/*/SKILL.md')]

          for filepath, kind in sorted(targets):
              filename = os.path.basename(filepath)

              # Skip README files
              if filename == 'README.md':
                  continue

              rel_path = os.path.relpath(filepath, plugins_dir)

              with open(filepath, 'r') as f:
                  content = f.read()

              # Extract frontmatter
              if not content.startswith('---\n'):
                  print(f"❌ {rel_path}: Missing frontmatter start")
                  failed = True
                  continue

              try:
                  end = content.index('\n---\n', 4)
                  frontmatter = content[4:end]
                  data = yaml.safe_load(frontmatter)

                  # Validate required fields
                  file_has_errors = False
                  required = ['name', 'description']
                  if kind == 'agent':
                      required += ['model', 'color']
                  for field in required:
                      if field not in data:
                          print(f"❌ {rel_path}: Missing required field '{field}'")
                          failed = True
                          file_has_errors = True

                  if kind == 'skill':
                      # model, color and argument-hint are agent-only fields
                      for field in ['model', 'color', 'argument-hint']:
                          if field in data:
                              print(f"❌ {rel_path}: Skill must not define '{field}'")
                              failed = True
                              file_has_errors = True

                      # The frontmatter name must match the skill directory
                      skill_dir = os.path.basename(os.path.dirname(filepath))
                      if data.get('name') != skill_dir:
                          print(f"❌ {rel_path}: name '{data.get('name')}' does not match directory '{skill_dir}'")
                          failed = True
                          file_has_errors = True

                  if not file_has_errors:
                      print(f"✅ {rel_path}: Valid YAML frontmatter")
              except Exception as e:
                  print(f"❌ {rel_path}: Invalid YAML - {str(e)}")
                  failed = True

          sys.exit(1 if failed else 0)
          EOF

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, check-yaml]
    if: always()

    steps:
      - name: Check validation status
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate.result }}" == "success" ]; then
            echo "✅ Structural validation: **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Structural validation: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.check-yaml.result }}" == "success" ]; then
            echo "✅ YAML validation: **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ YAML validation: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See details above for more information." >> $GITHUB_STEP_SUMMARY

          # Without this the job stays green even when the jobs it summarises are red.
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.check-yaml.result }}" != "success" ]; then
            exit 1
          fi